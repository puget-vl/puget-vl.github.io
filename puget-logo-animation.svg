<svg xmlns="http://www.w3.org/2000/svg" width="400" height="128" viewBox="0 0 400 128">
  <title>Puget</title>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .wave, .wave-caps {
        animation-duration: 12s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
      }
      .wave { animation-name: wave-left; }
      .wave-caps { animation-name: wave-cap-height; }
    }

    @keyframes wave-left {
      to { transform: translateX(-58px); }
    }

    /* Match the wave path's cubic control points at each quarter cycle. */
    @keyframes wave-cap-height {
      0% {
        transform: translateY(0);
        animation-timing-function: cubic-bezier(.3331, 0, .6669, .4757);
      }
      25%, 75% {
        transform: translateY(7px);
        animation-timing-function: cubic-bezier(.3331, .5243, .6669, 1);
      }
      50% {
        transform: translateY(14px);
        animation-timing-function: cubic-bezier(.3331, 0, .6669, .4757);
      }
      100% { transform: translateY(0); }
    }
  </style>
  <defs>
    <clipPath id="wave-window">
      <rect x="84" width="232" height="128"/>
    </clipPath>
