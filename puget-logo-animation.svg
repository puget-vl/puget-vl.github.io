<svg xmlns="http://www.w3.org/2000/svg" width="400" height="128" viewBox="0 0 400 128">
  <title>Puget</title>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .wave { animation: wave-left 12s linear infinite; }
      .letter {
        animation: bob 8s cubic-bezier(.3634, 0, .6366, 1) infinite;
        animation-delay: var(--phase);
      }
      .orca-spin {
        transform-origin: 187px 120px;
        animation: orca-spin 6.6667s linear -1.3333s infinite;
      }
    }

    @keyframes orca-spin {
      from { transform: rotate(0deg); }
      20%, 80% { transform: rotate(180deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes bob {
      from, to { transform: translateY(-4px); }
      50% { transform: translateY(4px); }
    }

    /* Dash distances follow the curve's arc length as the path slides left. */
    @keyframes wave-left {
      12.5% { stroke-dashoffset: -64.76px; }
      25% { stroke-dashoffset: -72.5px; }
      37.5% { stroke-dashoffset: -80.24px; }
      50% { stroke-dashoffset: -87px; }
      62.5% { stroke-dashoffset: -93.76px; }
      75% { stroke-dashoffset: -101.5px; }
      87.5% { stroke-dashoffset: -109.24px; }
      to { transform: translateX(-58px); stroke-dashoffset: -116px; }
    }
  </style>
